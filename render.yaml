# Deploy del gioco "Quanto Mi Conosci?" su Render (piano gratuito).
# Il sito vetrina nella cartella principale non è coinvolto.
services:
  - type: web
    name: quanto-mi-conosci
    runtime: node
    plan: free
    rootDir: quanto-mi-conosci
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
